{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="SmartLearn AI logo" class="auth-logo">
            <h1>Create Account</h1>
            <p>Join SmartLearn AI and study smarter.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form" id="registerForm">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="regUsername" name="username" placeholder="Choose a username" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="field password-field">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input type="password" id="regPassword" name="password" placeholder="Create a password" required>
                    <button type="button" class="toggle-pass" data-target="regPassword">Show</button>
                </div>
            </div>

            <div class="field password-field">
                <label for="confirm_password">Confirm Password</label>
                <div class="password-wrap">
                    <input type="password" id="confirmPassword" name="confirm_password" placeholder="Repeat password" required>
                    <button type="button" class="toggle-pass" data-target="confirmPassword">Show</button>
                </div>
            </div>

            <button type="submit" class="btn-primary">Register</button>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="{{ url_for('auth.login') }}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
