{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="SmartLearn AI logo" class="auth-logo">
            <h1>Welcome Back</h1>
            <p>Login to continue learning with SmartLearn AI.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form" id="loginForm">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="field password-field">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <button type="button" class="toggle-pass" data-target="password">Show</button>
                </div>
            </div>

            <button type="submit" class="btn-primary">Login</button>
        </form>

        <p class="auth-switch">
            Don’t have an account?
            <a href="{{ url_for('auth.register') }}">Create one</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
